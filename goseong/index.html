<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0E6E86">
<title>고성 아야진 2박 3일 · 스노클링 여행</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --ink:#0B3644; --sea:#0E6E86; --wave:#149AAE; --wave-soft:#8FD3DE;
    --sun:#F4A623; --coral:#EE6C56; --cafe:#5FA07A;
    --sand:#FBF3E2; --paper:#FFFDF8; --line:#EADFC8;
    --text:#14343E; --muted:#71828A; --shadow:0 10px 30px rgba(11,54,68,.14);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"Noto Sans KR",sans-serif;color:var(--text);background:var(--sand);-webkit-font-smoothing:antialiased;line-height:1.55}
  body::before{content:"";position:fixed;inset:0;z-index:-1;
    background:radial-gradient(1200px 400px at 80% -5%, rgba(20,154,174,.10), transparent 60%),
               radial-gradient(900px 380px at -10% 105%, rgba(244,166,35,.10), transparent 60%);}

  header{background:linear-gradient(135deg, var(--sea) 0%, var(--wave) 68%, #29b3c4 100%);color:#fff;position:relative;overflow:hidden;padding:22px 20px 34px}
  header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:12px;
    background:radial-gradient(14px 14px at 14px 0, var(--sand) 60%, transparent 62%) repeat-x;background-size:28px 26px;
    transform:rotate(180deg)}
  .eyebrow{font-size:12.5px;letter-spacing:.28em;text-transform:uppercase;opacity:.85;font-weight:500}
  h1{font-family:"Jua",sans-serif;font-weight:400;font-size:29px;line-height:1.15;margin-top:4px;text-shadow:0 2px 8px rgba(0,0,0,.12)}
  h1 .sun{color:#FFE08A}
  .trip-meta{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:12px;font-size:13px}
  .chip{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:4px 11px;display:inline-flex;align-items:center;gap:6px;font-weight:500}

  .tabs{display:flex;gap:7px;padding:16px 16px 4px;max-width:1160px;margin:0 auto}
  .tab{flex:1;background:var(--paper);border:1.5px solid var(--line);border-radius:16px 16px 6px 6px;padding:10px 6px;cursor:pointer;text-align:center;transition:.18s;box-shadow:0 2px 0 var(--line);position:relative;top:0}
  .tab .dnum{font-family:"Jua",sans-serif;font-size:12px;color:var(--muted);letter-spacing:.04em}
  .tab .ddate{font-family:"Jua",sans-serif;font-size:18px;line-height:1.1;color:var(--ink)}
  .tab .dsub{font-size:11px;color:var(--muted);margin-top:1px}
  .tab:hover{border-color:var(--wave-soft)}
  .tab.active{border-color:var(--wave);top:2px;box-shadow:0 0 0 3px rgba(20,154,174,.14)}
  .tab.active .ddate{color:var(--sea)}
  .tab.active::before{content:"";position:absolute;left:0;right:0;top:-1.5px;height:4px;border-radius:8px;background:var(--wave)}
  .tab.food.active{border-color:var(--coral);box-shadow:0 0 0 3px rgba(238,108,86,.16)}
  .tab.food.active .ddate{color:var(--coral)}
  .tab.food.active::before{background:var(--coral)}

  .wrap{max-width:1160px;margin:0 auto;padding:8px 16px 40px;display:grid;grid-template-columns:1fr;gap:16px}
  @media(min-width:900px){.wrap{grid-template-columns:1.05fr .95fr;align-items:start}.map-col{position:sticky;top:14px}}
  .wrap.solo{grid-template-columns:1fr !important;max-width:760px}

  .map-col{display:flex;flex-direction:column;gap:10px}
  #map{height:52vh;min-height:340px;border-radius:20px;border:3px solid #fff;box-shadow:var(--shadow);background:#dfeef1}
  @media(min-width:900px){#map{height:calc(100vh - 40px);max-height:720px}}
  .legend{display:flex;flex-wrap:wrap;gap:8px 12px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:9px 13px;font-size:12px;box-shadow:0 2px 8px rgba(11,54,68,.05)}
  .legend b{font-weight:500;color:var(--muted);margin-right:2px}
  .lg{display:inline-flex;align-items:center;gap:5px;font-weight:500}
  .dot{width:12px;height:12px;border-radius:50%;box-shadow:0 0 0 2px #fff inset}
  .dot.stay{background:var(--sun)} .dot.beach{background:var(--wave)} .dot.food{background:var(--coral)} .dot.cafe{background:var(--cafe)} .dot.transport{background:var(--ink)}

  .plan-col{background:var(--paper);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
  .plan-head{padding:16px 18px 14px;background:linear-gradient(180deg,#fff,#fdfaf1);border-bottom:1px dashed var(--line)}
  .plan-head .ph-title{font-family:"Jua",sans-serif;font-size:20px;color:var(--ink)}
  .plan-head .ph-stay{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:13px;background:#FFF3D6;color:#8a5b00;border:1px solid #F3DFA6;border-radius:999px;padding:3px 11px;font-weight:500}
  .plan-head .ph-move{font-size:12.5px;color:var(--sea);margin-top:8px;display:flex;align-items:flex-start;gap:6px}
  .plan-head .ph-sub{font-size:13px;color:var(--muted);margin-top:6px}
  .plan-head .ph-alert{margin-top:10px;font-size:12.5px;line-height:1.5;background:#EDF3FB;border:1px solid #CFDEF2;border-left:4px solid #2A5FA8;border-radius:10px;padding:8px 11px;color:#1B4A8C}
  .plan-head .ph-alert b{font-weight:700}

  .cond-bar{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
  .cond{display:inline-flex;align-items:center;gap:6px;background:#F1FAFB;border:1px solid #D7EEF1;border-radius:10px;padding:5px 9px;font-size:12px;line-height:1.3}
  .cond .ci{font-size:14px}.cond .cl{color:var(--muted)}.cond .cv{font-weight:700;color:var(--sea)}
  .cond.moon{background:#F3F1FA;border-color:#E1DCF0}.cond.moon .cv{color:#6A57B0}
  .cond.uv{background:#FFF2EC;border-color:#F6D9CC}.cond.uv .cv{color:#C9552F}
  .cond.sun{background:#FFF7E6;border-color:#F3E2B4}.cond.sun .cv{color:#B57A00}
  .cond.rain{background:#EDF3FB;border-color:#CFDEF2}.cond.rain .cv{color:#2A5FA8}
  .cond.rain.heavy{background:#E7EEFA;border-color:#B9CDEC}.cond.rain.heavy .cv{color:#1B4A8C}
  .cond.wave{background:#EAF7F9;border-color:#C8E7EC}.cond.wave .cv{color:#0E6E86}

  .timeline{padding:8px 14px 16px}
  .ti{display:grid;grid-template-columns:52px 1fr;gap:10px;position:relative;padding:9px 8px 9px 4px;border-radius:12px;transition:.15s}
  .ti.clickable{cursor:pointer}.ti.clickable:hover{background:#F3FAFB}
  .ti.active{background:#EAF7F9;box-shadow:inset 0 0 0 1.5px var(--wave-soft)}
  .timeline .ti:not(:last-child)::before{content:"";position:absolute;left:26px;top:34px;bottom:-9px;width:2px;background:repeating-linear-gradient(var(--line) 0 5px, transparent 5px 9px)}
  .ti .time{font-family:"Jua",sans-serif;font-size:13px;color:var(--muted);text-align:right;padding-top:2px;white-space:nowrap}
  .ti .node{display:flex;gap:9px;align-items:flex-start}
  .badge{width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:15px;background:#fff;box-shadow:0 0 0 2px #fff, 0 3px 8px rgba(11,54,68,.16);position:relative;z-index:1}
  .badge.stay{outline:2px solid var(--sun)}.badge.beach{outline:2px solid var(--wave)}.badge.food{outline:2px solid var(--coral)}.badge.cafe{outline:2px solid var(--cafe)}.badge.transport{outline:2px solid var(--ink)}.badge.plain{outline:2px solid var(--line)}
  .ti .body{min-width:0}
  .ti .title{font-weight:700;font-size:15px;color:var(--text)}
  .ti .place{font-size:12.5px;color:var(--sea);font-weight:500;margin-top:1px;display:inline-flex;align-items:center;gap:4px}
  .ti .place .pin{font-size:11px}
  .ti .note{font-size:12px;color:var(--muted);margin-top:2px}
  .ti .dnote{font-size:11.5px;color:#0E7C79;background:#E7F7F3;border:1px solid #C9EEE6;border-radius:8px;padding:3px 8px;margin-top:5px;display:inline-flex;gap:5px;align-items:flex-start;line-height:1.4}
  .ti .rnote{font-size:11.5px;color:#1B4A8C;background:#EDF3FB;border:1px solid #CFDEF2;border-radius:8px;padding:3px 8px;margin-top:5px;display:inline-flex;gap:5px;align-items:flex-start;line-height:1.4}
  .ti .route{display:inline-flex;align-items:center;gap:5px;margin-top:6px;font-size:11.5px;font-weight:600;color:#03875A;background:#EAF8F0;border:1px solid #BFE9D2;border-radius:8px;padding:4px 9px;text-decoration:none;line-height:1.35}
  .ti .route:hover{background:#dbf1e4}
  .ti .route .arr{color:var(--muted);font-weight:500}
  .ti .seq{display:inline-block;min-width:17px;height:17px;line-height:17px;text-align:center;background:var(--wave);color:#fff;border-radius:50%;font-size:10.5px;font-weight:700;margin-right:5px;vertical-align:1px}

  /* food tab */
  .food-sec{padding:6px 16px 4px}
  .food-sec h3{font-family:"Jua",sans-serif;font-size:15px;color:var(--ink);margin:12px 0 6px;display:flex;align-items:center;gap:7px}
  .food-sec h3 .tag{font-size:11px;color:var(--muted);font-family:"Noto Sans KR";font-weight:500}
  .fcard{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:13px;margin-bottom:8px;cursor:pointer;transition:.15s;background:#fff}
  .fcard:hover{border-color:var(--wave-soft);background:#F7FCFD}
  .fcard.active{border-color:var(--coral);background:#FFF6F3}
  .fcard .fnum{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:"Jua";font-size:13px;margin-top:1px}
  .fcard .fname{font-weight:700;font-size:14.5px;display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
  .fcard .frate{font-size:11.5px;color:#C9552F;font-weight:700}
  .fcard .fdesc{font-size:12.5px;color:var(--text);margin-top:2px}
  .fcard .fmeta{font-size:11.5px;color:var(--muted);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
  .fcard .fmeta .hrs{color:var(--sea);font-weight:500}
  .fcard .closed{color:#C9552F;font-weight:600}

  /* expense tab */
  .tab.money.active{border-color:#7A6BC4;box-shadow:0 0 0 3px rgba(122,107,196,.16)}
  .tab.money.active .ddate{color:#7A6BC4}
  .tab.money.active::before{background:#7A6BC4}
  .exp-sec{padding:8px 14px 4px}
  .exp-sum{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}
  .exp-card{border:1px solid var(--line);border-radius:14px;padding:11px 13px;background:#fff}
  .exp-card.total{background:linear-gradient(180deg,#F5F3FC,#fff);border-color:#DFD9F2}
  .exp-card .el{font-size:11.5px;color:var(--muted);font-weight:500}
  .exp-card .ev{font-family:"Jua",sans-serif;font-size:23px;color:var(--ink);margin-top:2px;line-height:1.1}
  .exp-card.total .ev{color:#5B4BA8}
  .exp-cats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .exp-cat{font-size:11.5px;border-radius:999px;padding:3px 10px;font-weight:600;border:1px solid}
  .cat-교통{background:#EAF3FB;border-color:#CBE0F2;color:#2A5FA8}
  .cat-숙박{background:#FFF3D6;border-color:#F3DFA6;color:#8a5b00}
  .cat-식사{background:#FFF0EC;border-color:#F6D9CC;color:#C9552F}
  .cat-카페{background:#EDF7F1;border-color:#CDE9D8;color:#37795A}
  .cat-기타{background:#F1F1F4;border-color:#DEDEE5;color:#5B5B6B}
  .exp-table{width:100%;border-collapse:collapse;font-size:12.5px}
  .exp-table th{text-align:left;font-size:11px;color:var(--muted);font-weight:500;padding:0 6px 6px;border-bottom:1px solid var(--line)}
  .exp-table td{padding:8px 6px;border-bottom:1px dashed var(--line);vertical-align:top}
  .exp-table td.amt{text-align:right;font-weight:700;color:var(--ink);white-space:nowrap}
  .exp-table td.per{text-align:right;color:var(--muted);white-space:nowrap;font-size:11.5px}
  .exp-table .ename{font-weight:600}
  .exp-table .ememo{font-size:11px;color:var(--muted);margin-top:2px}
  .exp-table .edate{color:var(--muted);white-space:nowrap;font-size:11.5px}
  .exp-del{border:none;background:none;cursor:pointer;color:#C9552F;font-size:13px;padding:2px 4px;opacity:.55}
  .exp-del:hover{opacity:1}
  .exp-form{background:#F7F6FC;border:1px solid #E4E0F2;border-radius:14px;padding:11px 12px;margin:14px 0 6px}
  .exp-form h4{font-family:"Jua",sans-serif;font-size:14px;color:#5B4BA8;margin-bottom:8px}
  .exp-form .row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
  .exp-form input,.exp-form select{font-family:inherit;font-size:12.5px;padding:7px 9px;border:1px solid #DAD5EC;border-radius:9px;background:#fff;color:var(--text);min-width:0}
  .exp-form input:focus,.exp-form select:focus{outline:2px solid #C6BDEA;outline-offset:-1px}
  .exp-form .f-name{flex:1 1 150px}
  .exp-form .f-amt{flex:1 1 110px}
  .exp-form .f-date,.exp-form .f-cat,.exp-form .f-basis{flex:0 1 auto}
  .exp-form .f-memo{flex:1 1 100%}
  .exp-add{background:#5B4BA8;color:#fff;border:none;border-radius:9px;padding:8px 16px;font-family:"Jua",sans-serif;font-size:13px;cursor:pointer}
  .exp-add:hover{background:#4b3d90}
  .exp-tools{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
  .exp-tool{font-size:11.5px;color:var(--sea);background:#F1FAFB;border:1px solid #D7EEF1;border-radius:8px;padding:5px 10px;cursor:pointer;font-weight:500}
  .exp-tool:hover{background:#e4f5f7}

  .foot{padding:14px 18px 18px;border-top:1px dashed var(--line);font-size:12px;color:var(--muted);background:#fdfaf1}
  .foot b{color:var(--sea);font-weight:500}
  .foot .links{margin-top:8px;display:flex;flex-wrap:wrap;gap:8px}
  .foot .links a{font-size:11.5px;color:var(--sea);text-decoration:none;border:1px solid #D7EEF1;background:#F1FAFB;border-radius:8px;padding:3px 9px;font-weight:500}

  .pin-marker{background:transparent;border:none}
  .pin-marker .pm{width:30px;height:30px;border-radius:50% 50% 50% 2px;transform:rotate(45deg);display:grid;place-items:center;box-shadow:0 4px 10px rgba(11,54,68,.35);border:2.5px solid #fff}
  .pin-marker .pm span{transform:rotate(-45deg);color:#fff;font-weight:700;font-size:13px;font-family:"Jua",sans-serif}
  .leaflet-popup-content-wrapper{border-radius:14px}
  .leaflet-popup-content{margin:11px 14px;font-family:"Noto Sans KR",sans-serif}
  .pop-t{font-family:"Jua",sans-serif;font-size:15px;color:var(--ink)}
  .pop-a{font-size:12px;color:var(--muted);margin-top:2px}
  .pop-times{margin-top:7px;display:flex;flex-wrap:wrap;gap:4px}
  .pop-times span{font-size:11px;background:#EAF7F9;color:var(--sea);border-radius:6px;padding:2px 7px;font-weight:500}
  .naver-link{display:inline-block;margin-top:8px;font-size:12px;color:#03C75A;font-weight:700;text-decoration:none}
</style>
</head>
<body>
<header>
  <div class="eyebrow">Gangwon · Goseong · Ayajin</div>
  <h1>아야진 <span class="sun">☀️</span> 스노클링 2박 3일</h1>
  <div class="trip-meta">
    <span class="chip">🗓️ 8/16 – 8/18</span>
    <span class="chip">🚌 동서울 07:30 → 속초 10:48 · 14:30 귀가</span>
    <span class="chip">🚗 차 없이</span>
    <span class="chip">🌧️ 8/16 종일 비 · 실내 대안 반영</span>
  </div>
</header>

<div class="tabs" id="tabs"></div>

<div class="wrap">
  <div class="map-col">
    <div id="map"></div>
    <div class="legend">
      <b>범례</b>
      <span class="lg"><i class="dot stay"></i>숙소</span>
      <span class="lg"><i class="dot beach"></i>해변·물놀이</span>
      <span class="lg"><i class="dot food"></i>식사·회</span>
      <span class="lg"><i class="dot cafe"></i>카페</span>
      <span class="lg"><i class="dot transport"></i>버스</span>
      <span class="lg" id="fitAll" style="cursor:pointer;margin-left:auto;color:var(--sea);border:1px solid #D7EEF1;background:#F1FAFB;border-radius:8px;padding:2px 8px">🔎 속초까지 전체 보기</span>
    </div>
  </div>

  <div class="plan-col">
    <div class="plan-head" id="planHead"></div>
    <div id="panel"></div>
    <div class="foot" id="foot"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const PLACES = {
  sokcho:      {name:"속초시외버스터미널", addr:"속초시 장안로 16", lat:38.210961, lng:128.591111, type:"transport", naver:"https://map.naver.com/p/search/속초시외버스터미널"},
  havichi:     {name:"하비치펜션", addr:"고성군 토성면 교암길 8", lat:38.286198, lng:128.547962, type:"stay", naver:"https://naver.me/FQuFOIrX"},
  havichiBeach:{name:"교암해수욕장", addr:"고성 토성면 교암리 · 하비치 옆 (동향·일출 명소, 능파대 인접)", lat:38.291059, lng:128.546962, type:"beach", naver:"https://map.naver.com/p/search/교암해수욕장"},
  sodamjeong:  {name:"소담정", addr:"육전·냉면 · 하비치 근처", lat:38.279648, lng:128.548939, type:"food", naver:"https://map.naver.com/p/search/소담정 고성"},
  ayajinStay:  {name:"바다별 민박", addr:"토성면 아야진해변길 139-7 2층", lat:38.274565, lng:128.553234, type:"stay", naver:"https://map.naver.com/p/search/아야진 바다별민박"},
  ayajinBeach: {name:"아야진 해수욕장", addr:"토성면 · 무지개 방파제 (일몰 명당)", lat:38.276600, lng:128.553300, type:"beach", naver:"https://map.naver.com/p/search/아야진해수욕장"},
  haenyeo:     {name:"해녀의집", addr:"전복죽·성게비빔밥 (9–15시)", lat:38.275157, lng:128.553161, type:"food", naver:"https://map.naver.com/p/search/아야진 해녀의집"},
  swimmingTurtle:{name:"스위밍터틀", addr:"아야진 대표 오션뷰 카페 · 루프탑", lat:38.279477, lng:128.553200, type:"cafe", naver:"https://map.naver.com/p/search/아야진 스위밍터틀"},
  hoe:         {name:"동해활어자연산전문점", addr:"아야진항 회센터 거리 (매일 10–21:30)", lat:38.272140, lng:128.556052, type:"food", naver:"https://map.naver.com/p/search/아야진 동해활어자연산전문점"},

function expStore(){
  try{ const o = JSON.parse(localStorage.getItem(EXP_KEY)||'{}');
       return {added:o.added||[], hidden:o.hidden||[]}; }
  catch(e){ return {added:[], hidden:[]}; }
}
function expSave(o){ try{ localStorage.setItem(EXP_KEY, JSON.stringify(o)); }catch(e){ alert('저장 실패 — 브라우저 저장공간을 확인해주세요.'); } }
function expAll(){
  const st = expStore();
  return EXPENSE_SEED.concat(st.added).filter(e=>st.hidden.indexOf(e.id)<0);
}
function won(n){ return n.toLocaleString('ko-KR')+'원'; }
function dateKey(d){ const m=String(d).match(/(\d+)\/(\d+)/); return m ? (+m[1])*100+(+m[2]) : 9999; }

function dayPlaces(day){

    if(!m[it.place]){ m[it.place]={id:it.place,times:[]}; order.push(it.place); }
    m[it.place].times.push({time:it.time,title:it.title,emoji:it.emoji});
  });
  return order.map((id,i)=>Object.assign({seq:i+1,id,times:m[id].times}, PLACES[id]));
}

function haversine(aLat,aLng,bLat,bLng){
  const R=6371,r=Math.PI/180;
  const dLat=(bLat-aLat)*r, dLng=(bLng-aLng)*r;
  const s=Math.sin(dLat/2)**2+Math.cos(aLat*r)*Math.cos(bLat*r)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
// 네이버 길찾기 딥링크 (좌표는 경도,위도 순)
function naverDir(f,t,mode){
  return 'https://map.naver.com/p/directions/'
    +f.lng+','+f.lat+','+encodeURIComponent(f.name)+',,/'
    +t.lng+','+t.lat+','+encodeURIComponent(t.name)+',,/-/'+mode;
}
function routeChip(f,t){
  const km=haversine(f.lat,f.lng,t.lat,t.lng);
  if(km<0.28) return ''; // 같은 구역 초근거리는 생략
  const transit=(f.type==='transport'||t.type==='transport'||km>1.7);
  const mode=transit?'transit':'walk';
  const icon=transit?'🚌':'🚶';
  const label=transit?'버스·택시':'도보';
  // 직선거리 × 1.3(실제 경로 굴곡) ÷ 4.2km/h. 짐 있으면 더 걸립니다.
  const timeTxt = transit ? '' : (' · 약 '+Math.max(1,Math.round(km*1.3/4.2*60))+'분');
  return '<a class="route" href="'+naverDir(f,t,mode)+'" target="_blank" rel="noopener">'
        +'🧭 '+f.name+' <span class="arr">→</span> '+t.name+' · '+icon+' '+label+timeTxt+' 길찾기</a>';
}

function renderDay(idx){
  setActiveTab(idx);
  const day = DAYS[idx];
  document.getElementById('planHead').innerHTML =
    '<div class="ph-title">Day '+(idx+1)+' · '+day.date+' ('+day.dow+') — '+day.title+'</div>'

    + (day.alert ? '<div class="ph-alert">☔ '+day.alert+'</div>' : '');
  document.getElementById('foot').innerHTML = '💡 '+day.foot+forecastNote+liveLinks;

  clearMap();
  const places = dayPlaces(day);
  const latlngs = [];
  const focus = [];   // 지도 축척 기준: 속초터미널처럼 멀리 떨어진 지점은 제외해 현장 디테일을 살림
  places.forEach(p=>{
    if(p.type!=='transport') focus.push([p.lat,p.lng]);
  });
  places.forEach(p=>{
    const color = TYPE_COLOR[p.type] || "#149AAE";
    const mk = L.marker([p.lat,p.lng], {icon:pinIcon(color,p.seq)}).addTo(layer);
    const timesHtml = p.times.map(t=>'<span>'+t.emoji+' '+t.time+' '+t.title+'</span>').join('');
    mk.bindPopup('<div class="pop-t">'+p.seq+'. '+p.name+'</div><div class="pop-a">'+p.addr+'</div>'
      +'<div class="pop-times">'+timesHtml+'</div>'
      +'<a class="naver-link" href="'+p.naver+'" target="_blank" rel="noopener">네이버지도에서 열기 →</a>');
    markerById[p.id]=mk;
    latlngs.push([p.lat,p.lng]);
  });
  if(latlngs.length>1) routeLine = L.polyline(latlngs, {color:'#149AAE',weight:3,opacity:.55,dashArray:'2 8',lineCap:'round'}).addTo(map);
  const fitTargets = focus.length ? focus : latlngs;
  if(fitTargets.length) map.fitBounds(L.latLngBounds(fitTargets).pad(0.25), {maxZoom:16});
  allLatlngs = latlngs;
  setTimeout(()=>map.invalidateSize(), 60);

  const panel = document.getElementById('panel');
  panel.innerHTML = '<div class="timeline" id="timeline"></div>';
  const tl = document.getElementById('timeline');
  const seqOf={}; places.forEach(p=>seqOf[p.id]=p.seq);
  let prevPlace=null;
  day.items.forEach(it=>{
    const p = it.place ? PLACES[it.place] : null;
    const type = p ? p.type : 'plain';
    let routeHtml='';
    if(p && prevPlace && it.place!==prevPlace) routeHtml = routeChip(PLACES[prevPlace], p);
    if(p) prevPlace = it.place;
    const row = document.createElement('div');
    row.className = 'ti' + (p ? ' clickable' : '');
    row.innerHTML =
      '<div class="time">'+it.time+'</div>'
      +'<div class="node"><div class="badge '+type+'">'+it.emoji+'</div>'
      +'<div class="body"><div class="title">'+it.title+'</div>'
      +(p ? '<div class="place"><span class="seq">'+seqOf[it.place]+'</span><span class="pin">📍</span>'+p.name+'</div>' : '')
      +(it.note ? '<div class="note">'+it.note+'</div>' : '')
      +(it.dnote ? '<div class="dnote">🗓️ <span>'+it.dnote+'</span></div>' : '')
      +(it.rnote ? '<div class="rnote">☔ <span>'+it.rnote+'</span></div>' : '')
      + routeHtml
      +'</div></div>';
    if(p) row.addEventListener('click', (e)=>{
      if(e.target.closest('.route')) return;
      document.querySelectorAll('.ti').forEach(x=>x.classList.remove('active'));
      row.classList.add('active');
      const mk = markerById[it.place];
      if(mk){ map.panTo(mk.getLatLng(),{animate:true}); mk.openPopup(); }
    });
    tl.appendChild(row);
  });
}

    +'<span class="exp-tool" id="expCopy">📋 복사 (마크다운 표)</span>'
    +'<span class="exp-tool" id="expReset">↺ 내가 추가한 것 초기화</span>'
    +'</div></div>';

  const panel = document.getElementById('panel');
  panel.innerHTML = html;

  panel.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click', ()=>{
    const id = b.getAttribute('data-del');
    const st = expStore();
    st.added = st.added.filter(x=>x.id!==id);
    if(EXPENSE_SEED.some(x=>x.id===id)) st.hidden.push(id);
    expSave(st); renderExpense();
  }));

  document.getElementById('fAdd').addEventListener('click', ()=>{
    const name = document.getElementById('fName').value.trim();
    const raw  = document.getElementById('fAmt').value.replace(/[^0-9]/g,'');
    if(!name || !raw){ alert('항목과 금액을 입력해주세요.'); return; }
    const basis = +document.getElementById('fBasis').value;
    const st = expStore();
    st.added.push({
      id:'u'+Date.now(),
      date: document.getElementById('fDate').value,
      cat:  document.getElementById('fCat').value,
      name: name,
      amount: (+raw) * (basis===1 ? HEADCOUNT : 1),
      memo: document.getElementById('fMemo').value.trim()
    });
    expSave(st); renderExpense();
  });

  document.getElementById('expCopy').addEventListener('click', ()=>{
    let md = '| 날짜 | 분류 | 항목 | 2인 | 1인 |\n|---|---|---|---|---|\n';
    list.forEach(e=>{ md += '| '+e.date+' | '+e.cat+' | '+e.name+(e.memo?' ('+e.memo+')':'')+' | '+won(e.amount)+' | '+won(Math.round(e.amount/HEADCOUNT))+' |\n'; });
    md += '| | | **합계** | **'+won(total)+'** | **'+won(Math.round(total/HEADCOUNT))+'** |';
    navigator.clipboard.writeText(md).then(
      ()=>{ document.getElementById('expCopy').textContent = '✅ 복사됨'; },
      ()=>{ alert(md); }
    );
  });

  document.getElementById('expReset').addEventListener('click', ()=>{
    if(confirm('직접 추가한 지출을 모두 지웁니다. 기본 항목(버스·숙소)은 남습니다. 진행할까요?')){
      expSave({added:[], hidden:[]}); renderExpense();
    }
  });
}

const tabsEl = document.getElementById('tabs');
DAYS.forEach((d,i)=>{
  const el=document.createElement('div'); el.className='tab';
  el.innerHTML='<div class="dnum">DAY '+(i+1)+'</div><div class="ddate">'+d.date+'</div><div class="dsub">'+d.dow+'요일</div>';
  el.addEventListener('click', ()=>renderDay(i));
  tabsEl.appendChild(el);
});
const foodTab = document.createElement('div');
foodTab.className='tab food';
foodTab.innerHTML='<div class="dnum">EAT</div><div class="ddate">🍽️</div><div class="dsub">맛집</div>';
foodTab.addEventListener('click', renderFood);
tabsEl.appendChild(foodTab);

const moneyTab = document.createElement('div');
moneyTab.className='tab money';
moneyTab.innerHTML='<div class="dnum">₩</div><div class="ddate">💰</div><div class="dsub">지출</div>';
moneyTab.addEventListener('click', renderExpense);
tabsEl.appendChild(moneyTab);

document.getElementById('fitAll').addEventListener('click', ()=>{
  if(allLatlngs.length) map.fitBounds(L.latLngBounds(allLatlngs).pad(0.2));
});

renderDay(0);
window.addEventListener('resize', ()=>map.invalidateSize());
</script>
</body>
</html>
