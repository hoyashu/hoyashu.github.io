<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2A6F8E">
<title>영흥도 스테이담소 풀빌라 1박 2일 · 조동아리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --ink:#1B2A41; --sea:#2A6F8E; --wave:#3E9EBC; --wave-soft:#A6DCE9;
    --sun:#F2A65A; --coral:#E8664F; --cafe:#6FA98A; --plum:#8A6BB1;
    --sand:#FAF4EC; --paper:#FFFDF9; --line:#EADFD0;
    --text:#22323D; --muted:#77848C; --shadow:0 10px 30px rgba(27,42,65,.14);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"Noto Sans KR",sans-serif;color:var(--text);background:var(--sand);-webkit-font-smoothing:antialiased;line-height:1.55}
  body::before{content:"";position:fixed;inset:0;z-index:-1;
    background:radial-gradient(1200px 400px at 80% -5%, rgba(62,158,188,.10), transparent 60%),
               radial-gradient(900px 380px at -10% 105%, rgba(232,102,79,.10), transparent 60%);}

  header{background:linear-gradient(135deg, var(--ink) 0%, var(--sea) 46%, #E8834F 100%);color:#fff;position:relative;overflow:hidden;padding:22px 20px 34px}
  header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:12px;
    background:radial-gradient(14px 14px at 14px 0, var(--sand) 60%, transparent 62%) repeat-x;background-size:28px 26px;
    transform:rotate(180deg)}
  .eyebrow{font-size:12.5px;letter-spacing:.28em;text-transform:uppercase;opacity:.85;font-weight:500}
  h1{font-family:"Jua",sans-serif;font-weight:400;font-size:29px;line-height:1.15;margin-top:4px;text-shadow:0 2px 8px rgba(0,0,0,.14)}
  h1 .sun{color:#FFE08A}
  .trip-meta{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:12px;font-size:13px}
  .chip{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:4px 11px;display:inline-flex;align-items:center;gap:6px;font-weight:500}

  .tabs{display:flex;gap:6px;padding:16px 12px 4px;max-width:1160px;margin:0 auto}
  .tab{flex:1;background:var(--paper);border:1.5px solid var(--line);border-radius:16px 16px 6px 6px;padding:10px 4px;cursor:pointer;text-align:center;transition:.18s;box-shadow:0 2px 0 var(--line);position:relative;top:0}
  .tab .dnum{font-family:"Jua",sans-serif;font-size:11.5px;color:var(--muted);letter-spacing:.04em}
  .tab .ddate{font-family:"Jua",sans-serif;font-size:17px;line-height:1.1;color:var(--ink)}
  .tab .dsub{font-size:10.5px;color:var(--muted);margin-top:1px}
  .tab:hover{border-color:var(--wave-soft)}
  .tab.active{border-color:var(--wave);top:2px;box-shadow:0 0 0 3px rgba(62,158,188,.14)}
  .tab.active .ddate{color:var(--sea)}
  .tab.active::before{content:"";position:absolute;left:0;right:0;top:-1.5px;height:4px;border-radius:8px;background:var(--wave)}
  .tab.prep.active{border-color:var(--cafe);box-shadow:0 0 0 3px rgba(111,169,138,.18)}
  .tab.prep.active .ddate{color:var(--cafe)} .tab.prep.active::before{background:var(--cafe)}
  .tab.food.active{border-color:var(--coral);box-shadow:0 0 0 3px rgba(232,102,79,.16)}
  .tab.food.active .ddate{color:var(--coral)} .tab.food.active::before{background:var(--coral)}
  .tab.money.active{border-color:var(--plum);box-shadow:0 0 0 3px rgba(138,107,177,.16)}
  .tab.money.active .ddate{color:var(--plum)} .tab.money.active::before{background:var(--plum)}

  .wrap{max-width:1160px;margin:0 auto;padding:8px 16px 40px;display:grid;grid-template-columns:1fr;gap:16px}
  @media(min-width:900px){.wrap{grid-template-columns:1.05fr .95fr;align-items:start}.map-col{position:sticky;top:14px}}
  .wrap.solo{grid-template-columns:1fr !important;max-width:780px}

  .map-col{display:flex;flex-direction:column;gap:10px}
  #map{height:50vh;min-height:320px;border-radius:20px;border:3px solid #fff;box-shadow:var(--shadow);background:#dfeef1}
  @media(min-width:900px){#map{height:calc(100vh - 40px);max-height:720px}}
  .legend{display:flex;flex-wrap:wrap;gap:8px 12px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:9px 13px;font-size:12px;box-shadow:0 2px 8px rgba(27,42,65,.05)}
  .legend b{font-weight:500;color:var(--muted);margin-right:2px}
  .lg{display:inline-flex;align-items:center;gap:5px;font-weight:500}
  .dot{width:12px;height:12px;border-radius:50%;box-shadow:0 0 0 2px #fff inset}
  .dot.stay{background:var(--sun)} .dot.beach{background:var(--wave)} .dot.food{background:var(--coral)}
  .dot.cafe{background:var(--cafe)} .dot.transport{background:var(--ink)} .dot.mart{background:var(--plum)}

  .plan-col{background:var(--paper);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
  .plan-head{padding:16px 18px 14px;background:linear-gradient(180deg,#fff,#fdfaf3);border-bottom:1px dashed var(--line)}
  .plan-head .ph-title{font-family:"Jua",sans-serif;font-size:20px;color:var(--ink)}
  .plan-head .ph-stay{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:13px;background:#FFF3D6;color:#8a5b00;border:1px solid #F3DFA6;border-radius:999px;padding:3px 11px;font-weight:500}
  .plan-head .ph-move{font-size:12.5px;color:var(--sea);margin-top:8px;display:flex;align-items:flex-start;gap:6px}
  .plan-head .ph-sub{font-size:13px;color:var(--muted);margin-top:6px}
  .plan-head .ph-alert{margin-top:10px;font-size:12.5px;line-height:1.55;background:#FFF4EC;border:1px solid #F6DCC9;border-left:4px solid var(--coral);border-radius:10px;padding:9px 11px;color:#8f4327}
  .plan-head .ph-alert b{font-weight:700}

  .cond-bar{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
  .cond{display:inline-flex;align-items:center;gap:6px;background:#F1FAFB;border:1px solid #D7EEF1;border-radius:10px;padding:5px 9px;font-size:12px;line-height:1.3}
  .cond .ci{font-size:14px}.cond .cl{color:var(--muted)}.cond .cv{font-weight:700;color:var(--sea)}
  .cond.moon{background:#F4F1FA;border-color:#E3DCF0}.cond.moon .cv{color:#6A57B0}
  .cond.tide{background:#EAF7F9;border-color:#C8E7EC}.cond.tide .cv{color:#0E6E86}
  .cond.sun{background:#FFF7E6;border-color:#F3E2B4}.cond.sun .cv{color:#B57A00}
  .cond.rain{background:#EDF3FB;border-color:#CFDEF2}.cond.rain .cv{color:#2A5FA8}
  .cond.rain.heavy{background:#E7EEFA;border-color:#B9CDEC}.cond.rain.heavy .cv{color:#1B4A8C}
  .cond.temp{background:#FFF2EC;border-color:#F6D9CC}.cond.temp .cv{color:#C9552F}

  .timeline{padding:8px 14px 16px}
  .ti{display:grid;grid-template-columns:52px 1fr;gap:10px;position:relative;padding:9px 8px 9px 4px;border-radius:12px;transition:.15s}
  .ti.clickable{cursor:pointer}.ti.clickable:hover{background:#F3FAFB}
  .ti.active{background:#EAF7F9;box-shadow:inset 0 0 0 1.5px var(--wave-soft)}
  .ti.hl{background:#FFF6EC;box-shadow:inset 0 0 0 1.5px #F3D0A8}
  .timeline .ti:not(:last-child)::before{content:"";position:absolute;left:26px;top:34px;bottom:-9px;width:2px;background:repeating-linear-gradient(var(--line) 0 5px, transparent 5px 9px)}
  .ti .time{font-family:"Jua",sans-serif;font-size:13px;color:var(--muted);text-align:right;padding-top:2px;white-space:nowrap}
  .ti .node{display:flex;gap:9px;align-items:flex-start}
  .badge{width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:15px;background:#fff;box-shadow:0 0 0 2px #fff, 0 3px 8px rgba(27,42,65,.16);position:relative;z-index:1}
  .badge.stay{outline:2px solid var(--sun)}.badge.beach{outline:2px solid var(--wave)}.badge.food{outline:2px solid var(--coral)}
  .badge.cafe{outline:2px solid var(--cafe)}.badge.transport{outline:2px solid var(--ink)}.badge.mart{outline:2px solid var(--plum)}.badge.plain{outline:2px solid var(--line)}
  .ti .body{min-width:0}
  .ti .title{font-weight:700;font-size:15px;color:var(--text)}
  .ti .title .star{color:var(--sun)}
  .ti .place{font-size:12.5px;color:var(--sea);font-weight:500;margin-top:1px;display:inline-flex;align-items:center;gap:4px}
  .ti .place .pin{font-size:11px}
  .ti .note{font-size:12px;color:var(--muted);margin-top:2px}
  .ti .dnote{font-size:11.5px;color:#0E7C79;background:#E7F7F3;border:1px solid #C9EEE6;border-radius:8px;padding:3px 8px;margin-top:5px;display:inline-flex;gap:5px;align-items:flex-start;line-height:1.45}
  .ti .rnote{font-size:11.5px;color:#8f4327;background:#FFF4EC;border:1px solid #F6DCC9;border-radius:8px;padding:3px 8px;margin-top:5px;display:inline-flex;gap:5px;align-items:flex-start;line-height:1.45}
  .ti .route{display:inline-flex;align-items:center;gap:5px;margin-top:6px;font-size:11.5px;font-weight:600;color:#03875A;background:#EAF8F0;border:1px solid #BFE9D2;border-radius:8px;padding:4px 9px;text-decoration:none;line-height:1.35}
  .ti .route:hover{background:#dbf1e4}
  .ti .route .arr{color:var(--muted);font-weight:500}
  .ti .seq{display:inline-block;min-width:17px;height:17px;line-height:17px;text-align:center;background:var(--wave);color:#fff;border-radius:50%;font-size:10.5px;font-weight:700;margin-right:5px;vertical-align:1px}

  /* 준비물 */
  .prep-sec{padding:6px 16px 4px}
  .prep-sec h3{font-family:"Jua",sans-serif;font-size:15px;color:var(--ink);margin:14px 0 6px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .prep-sec h3 .tag{font-size:11px;color:var(--muted);font-family:"Noto Sans KR";font-weight:500}
  .pitem{display:flex;gap:9px;align-items:flex-start;padding:7px 9px;border:1px solid var(--line);border-radius:11px;margin-bottom:6px;background:#fff;cursor:pointer;transition:.14s}
  .pitem:hover{border-color:var(--wave-soft);background:#F8FCFD}
  .pitem.done{background:#F3F6F4;border-color:#DDE6E0;opacity:.62}
  .pitem.done .pname{text-decoration:line-through}
  .pbox{width:19px;height:19px;flex:none;border-radius:6px;border:1.8px solid #CBD5D8;display:grid;place-items:center;font-size:12px;color:#fff;margin-top:1px;background:#fff}
  .pitem.done .pbox{background:var(--cafe);border-color:var(--cafe)}
  .pname{font-weight:600;font-size:14px}
  .pnote{font-size:11.5px;color:var(--muted);margin-top:1px;line-height:1.45}
  .pnote b{color:var(--coral);font-weight:700}
  .prep-bar{display:flex;align-items:center;gap:10px;padding:10px 16px 0;flex-wrap:wrap}
  .prep-prog{flex:1 1 160px;height:9px;background:#EDE7DD;border-radius:99px;overflow:hidden;min-width:120px}
  .prep-prog i{display:block;height:100%;background:linear-gradient(90deg,var(--cafe),var(--wave));border-radius:99px;transition:.3s}
  .prep-cnt{font-family:"Jua",sans-serif;font-size:13px;color:var(--cafe)}

  /* 맛집 */
  .food-sec{padding:6px 16px 4px}
  .food-sec h3{font-family:"Jua",sans-serif;font-size:15px;color:var(--ink);margin:12px 0 6px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .food-sec h3 .tag{font-size:11px;color:var(--muted);font-family:"Noto Sans KR";font-weight:500}
  .fcard{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:13px;margin-bottom:8px;cursor:pointer;transition:.15s;background:#fff}
  .fcard:hover{border-color:var(--wave-soft);background:#F8FCFD}
  .fcard.active{border-color:var(--coral);background:#FFF6F3}
  .fcard .fnum{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:"Jua";font-size:13px;margin-top:1px}
  .fcard .fname{font-weight:700;font-size:14.5px;display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
  .fcard .fdesc{font-size:12.5px;color:var(--text);margin-top:2px}
  .fcard .fmeta{font-size:11.5px;color:var(--muted);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
  .fcard .fmeta .hrs{color:var(--sea);font-weight:500}
  .fcard .closed{color:#C9552F;font-weight:600}

  /* 지출 */
  .exp-sec{padding:8px 14px 4px}
  .exp-sum{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}
  .exp-card{border:1px solid var(--line);border-radius:14px;padding:11px 13px;background:#fff}
  .exp-card.total{background:linear-gradient(180deg,#F6F3FC,#fff);border-color:#E2DBF2}
  .exp-card .el{font-size:11.5px;color:var(--muted);font-weight:500}
  .exp-card .ev{font-family:"Jua",sans-serif;font-size:23px;color:var(--ink);margin-top:2px;line-height:1.1}
  .exp-card.total .ev{color:#5B4BA8}
  .exp-cats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .exp-cat{font-size:11.5px;border-radius:999px;padding:3px 10px;font-weight:600;border:1px solid}
  .cat-숙박{background:#FFF3D6;border-color:#F3DFA6;color:#8a5b00}
  .cat-옵션{background:#EDF7F1;border-color:#CDE9D8;color:#37795A}
  .cat-장보기{background:#F3EEFB;border-color:#DED2F0;color:#5B4BA8}
  .cat-식사{background:#FFF0EC;border-color:#F6D9CC;color:#C9552F}
  .cat-교통{background:#EAF3FB;border-color:#CBE0F2;color:#2A5FA8}
  .cat-기타{background:#F1F1F4;border-color:#DEDEE5;color:#5B5B6B}
  .exp-table{width:100%;border-collapse:collapse;font-size:12.5px}
  .exp-table th{text-align:left;font-size:11px;color:var(--muted);font-weight:500;padding:0 6px 6px;border-bottom:1px solid var(--line)}
  .exp-table td{padding:8px 6px;border-bottom:1px dashed var(--line);vertical-align:top}
  .exp-table td.amt{text-align:right;font-weight:700;color:var(--ink);white-space:nowrap}
  .exp-table td.per{text-align:right;color:var(--muted);white-space:nowrap;font-size:11.5px}
  .exp-table .ename{font-weight:600}
  .exp-table .ememo{font-size:11px;color:var(--muted);margin-top:2px}
  .exp-table .edate{color:var(--muted);white-space:nowrap;font-size:11.5px}
  .exp-del,.exp-edit{border:none;background:none;cursor:pointer;font-size:13px;padding:2px 4px;opacity:.55}
  .exp-del{color:#C9552F}
  .exp-del:hover,.exp-edit:hover{opacity:1}
  .exp-form{background:#F8F6FC;border:1px solid #E4E0F2;border-radius:14px;padding:11px 12px;margin:14px 0 6px}
  .exp-form h4{font-family:"Jua",sans-serif;font-size:14px;color:#5B4BA8;margin-bottom:8px}
  .exp-form .row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;align-items:center}
  .exp-form input,.exp-form select{font-family:inherit;font-size:12.5px;padding:7px 9px;border:1px solid #DAD5EC;border-radius:9px;background:#fff;color:var(--text);min-width:0}
  .exp-form input:focus,.exp-form select:focus{outline:2px solid #C6BDEA;outline-offset:-1px}
  .exp-form .f-name{flex:1 1 150px}
  .exp-form .f-amt{flex:0 1 120px}
  .exp-form .f-memo{flex:1 1 100%}
  .exp-form.editing{background:#FFF7E6;border-color:#F3E2B4}
  .exp-form.editing h4{color:#B57A00}
  .who{font-size:11.5px;border:1px solid #DAD5EC;background:#fff;border-radius:999px;padding:4px 10px;cursor:pointer;font-weight:600;color:var(--muted);user-select:none}
  .who.on{background:#EFEAFB;border-color:#BFB2E4;color:#5B4BA8}
  .payer{font-size:10.5px;font-weight:700;border-radius:999px;padding:2px 7px;border:1px solid;white-space:nowrap}
  .payer-소진{background:#EAF3FB;border-color:#CBE0F2;color:#2A5FA8}
  .payer-은정{background:#FDEEF4;border-color:#F3CFDF;color:#B03A6B}
  .payer-주희{background:#EAF8F0;border-color:#BFE9D2;color:#03875A}
  .payer-채아{background:#FFF3D6;border-color:#F3DFA6;color:#8a5b00}
  .payer-공동{background:#F1F1F4;border-color:#DEDEE5;color:#5B5B6B}
  .exp-settle{border:1px solid #E4E0F2;background:linear-gradient(180deg,#F8F6FC,#fff);border-radius:14px;padding:11px 13px;margin-bottom:12px;font-size:12.5px;line-height:1.6}
  .exp-settle .st{font-family:"Jua",sans-serif;font-size:16px;color:#5B4BA8}
  .exp-settle .sub{color:var(--muted);font-size:11.5px;margin-top:3px}
  .exp-settle .pay-line{margin-top:5px;font-size:13px;font-weight:600;color:var(--ink)}
  .exp-add{background:#5B4BA8;color:#fff;border:none;border-radius:9px;padding:8px 16px;font-family:"Jua",sans-serif;font-size:13px;cursor:pointer}
  .exp-add:hover{background:#4b3d90}
  .exp-cancel{background:#fff;color:var(--muted);border:1px solid var(--line);border-radius:9px;padding:8px 14px;font-family:"Jua",sans-serif;font-size:13px;cursor:pointer}
  .exp-tools{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
  .exp-tool{font-size:11.5px;color:var(--sea);background:#F1FAFB;border:1px solid #D7EEF1;border-radius:8px;padding:5px 10px;cursor:pointer;font-weight:500}
  .exp-tool:hover{background:#e4f5f7}

  .foot{padding:14px 18px 18px;border-top:1px dashed var(--line);font-size:12px;color:var(--muted);background:#fdfaf3;line-height:1.6}
  .foot b{color:var(--sea);font-weight:500}
  .foot .links{margin-top:8px;display:flex;flex-wrap:wrap;gap:8px}
  .foot .links a{font-size:11.5px;color:var(--sea);text-decoration:none;border:1px solid #D7EEF1;background:#F1FAFB;border-radius:8px;padding:3px 9px;font-weight:500}

  .pin-marker{background:transparent;border:none}
  .pin-marker .pm{width:30px;height:30px;border-radius:50% 50% 50% 2px;transform:rotate(45deg);display:grid;place-items:center;box-shadow:0 4px 10px rgba(27,42,65,.35);border:2.5px solid #fff}
  .pin-marker .pm span{transform:rotate(-45deg);color:#fff;font-weight:700;font-size:13px;font-family:"Jua",sans-serif}
  .leaflet-popup-content-wrapper{border-radius:14px}
  .leaflet-popup-content{margin:11px 14px;font-family:"Noto Sans KR",sans-serif}
  .pop-t{font-family:"Jua",sans-serif;font-size:15px;color:var(--ink)}
  .pop-a{font-size:12px;color:var(--muted);margin-top:2px}
  .pop-times{margin-top:7px;display:flex;flex-wrap:wrap;gap:4px}
  .pop-times span{font-size:11px;background:#EAF7F9;color:var(--sea);border-radius:6px;padding:2px 7px;font-weight:500}
  .naver-link{display:inline-block;margin-top:8px;font-size:12px;color:#03C75A;font-weight:700;text-decoration:none}
  .backlink{display:inline-block;margin-top:10px;font-size:11.5px;color:rgba(255,255,255,.8);text-decoration:none;border-bottom:1px dotted rgba(255,255,255,.5)}
</style>
</head>
<body>
<header>
  <div class="eyebrow">Incheon · Ongjin · Yeongheungdo</div>
  <h1>스테이담소 풀빌라 <span class="sun">🌅</span> 조동아리 1박 2일</h1>
  <div class="trip-meta">
    <span class="chip">🗓️ 9/13(일) – 9/14(월)</span>
    <span class="chip">👯 은정 · 주희 · 채아 · 소진 (4인)</span>
    <span class="chip">🏊 개인풀 + 자쿠지 + 바베큐</span>
    <span class="chip">🌇 일몰 18:46 · 만조 18:10</span>
  </div>
  <a class="backlink" href="../">← 다른 여행 보기</a>
</header>

<div class="tabs" id="tabs"></div>

<div class="wrap">
  <div class="map-col">
    <div id="map"></div>
    <div class="legend">
      <b>범례</b>

const PAYER_RE = /\s*·?\s*지출자\s*:\s*([^\s·]+)\s*$/;
const WHO_RE   = /\s*·?\s*분담\s*:\s*([^·]+?)\s*(?=·\s*지출자|$)/;

function splitMeta(memo){
  let raw = String(memo||'');
  let payer = '공동', who = MEMBERS.slice();
  const mp = raw.match(PAYER_RE);
  if(mp && PAYERS.indexOf(mp[1])>=0){ payer = mp[1]; raw = raw.replace(PAYER_RE,''); }
  const mw = raw.match(WHO_RE);
  if(mw){
    const list = mw[1].split(',').map(s=>s.trim()).filter(s=>MEMBERS.indexOf(s)>=0);
    if(list.length) who = list;
    raw = raw.replace(WHO_RE,'');
  }
  return {memo: raw.replace(/^\s*·\s*/,'').trim(), payer: payer, who: who};
}
function joinMeta(memo, payer, who){
  let out = String(memo||'').replace(WHO_RE,'').replace(PAYER_RE,'').trim();
  if(who.length && who.length < MEMBERS.length) out = (out ? out+' · ' : '') + '분담:' + who.join(',');
  out = (out ? out+' · ' : '') + '지출자:' + payer;
  return out;
}

function expAll(){

/* 구글시트가 "9/13"을 날짜 값으로 바꿔버려서 "Sun Sep 13 2026..."로 돌아온다 → 다시 "9/13"으로 */
function normDate(d){
  const s = String(d||'').trim();
  if(/^\d{1,2}\/\d{1,2}$/.test(s)) return s;
  const dt = new Date(s);
  if(!isNaN(dt.getTime())) return (dt.getMonth()+1)+'/'+dt.getDate();
  return s;
}
/* 서버 응답(items)을 로컬 상태로 접어 넣는다. 아직 못 올린 대기열은 남겨둔다. */
function foldServerItems(items){
  const st = expStore();
  const hidden = [], added = [];
  items.forEach(it=>{
    if(it.deleted){ hidden.push(it.id); return; }
    if(added.some(a=>a.id===it.id)) return;   // 같은 id가 두 줄이면 첫 줄만
    added.push({id:it.id, date:normDate(it.date), cat:it.cat, name:it.name, amount:it.amount, memo:it.memo});
  });
  st.pending.forEach(op=>{
    if(op.action==='add' && !added.some(a=>a.id===op.item.id)) added.push(op.item);
    if(op.action==='delete' && hidden.indexOf(op.id)<0) hidden.push(op.id);
  });
  st.added = added; st.hidden = hidden;
  expSave(st);
}
function syncCall(payload){
  return fetch(SYNC_URL, {
    // text/plain 이어야 preflight(OPTIONS) 없이 Apps Script로 바로 간다
    method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(Object.assign({key:SYNC_KEY, trip:SYNC_TRIP}, payload))
  }).then(r=>r.json());
}
/* 시트가 완전히 비어 있을 때만 예약분 3건을 한 번 밀어 넣는다 */
const BOOT_FLAG = 'yeongheung_bootstrapped_v1';
function maybeBootstrap(items){
  if(items && items.length) return false;
  try{ if(localStorage.getItem(BOOT_FLAG)) return false; }catch(e){}
  const st = expStore();
  BOOTSTRAP.forEach(it=>{
    if(st.added.some(a=>a.id===it.id)) return;
    st.added.push(it);
    st.pending.push({action:'add', item:it});
  });
  expSave(st);
  try{ localStorage.setItem(BOOT_FLAG,'1'); }catch(e){}
  return true;
}
/* 대기열을 순서대로 밀어 넣고, 마지막 목록으로 로컬을 갱신.

   ⚠️ 먼저 list를 한 번 불러 **백엔드가 여행별 시트 버전인지** 확인한다.
   구버전 Apps Script는 trip 값을 무시하고 고성 여행 시트("지출")에 그대로 쓰기 때문에,
   확인 없이 보내면 남의 여행 장부를 오염시킨다. 아니면 쓰지 않고 대기열에 그대로 둔다. */
const EXPECT_SHEET = '지출-' + SYNC_TRIP;
let syncInFlight = null;   // 같은 대기열을 두 번 보내 시트에 중복 행이 생기는 걸 막는다
function syncFlush(){
  if(!SYNC_URL) return Promise.resolve();
  if(syncInFlight) return syncInFlight;
  syncState = 'syncing'; paintSyncBadge();

  syncInFlight = syncCall({action:'list'})
    .then(res=>{
      if(!res || !res.ok) throw new Error(res && res.error || 'sync failed');
      if(res.trip !== EXPECT_SHEET){
        // 구버전 백엔드 — 아무것도 쓰지 않고 로컬에 그대로 둔다
        syncState = 'stale'; paintSyncBadge();
        return null;
      }
      const st = expStore();
      let chain = Promise.resolve(null);
      st.pending.forEach(op=>{
        chain = chain.then(()=> op.action==='add'
          ? syncCall(Object.assign({action:'add'}, op.item))
          : syncCall({action:'delete', id:op.id}));
      });
      return chain.then(()=> st.pending.length ? syncCall({action:'list'}) : res)
        .then(fin=>{
          if(!fin || !fin.ok) throw new Error(fin && fin.error || 'sync failed');
          const s2 = expStore(); s2.pending = []; expSave(s2);
          foldServerItems(fin.items||[]);
          syncState = 'idle';
          if(maybeBootstrap(fin.items||[])){ syncInFlight = null; return syncFlush(); }
          if(currentView.type === 'expense') renderExpense();
        });
    })
    .catch(err=>{
      syncState = 'error';
      paintSyncBadge(String(err.message||err));
    })
    .then(()=>{ syncInFlight = null; }, ()=>{ syncInFlight = null; });
  return syncInFlight;
}

/* 최소 횟수 송금 계산 — 많이 낸 사람과 덜 낸 사람을 큰 금액부터 짝지어 상계 */
function settle(net){
  const cred = [], debt = [];
  Object.keys(net).forEach(k=>{
    const v = Math.round(net[k]);
    if(v > 0) cred.push({who:k, amt:v});
    else if(v < 0) debt.push({who:k, amt:-v});
  });
  cred.sort((a,b)=>b.amt-a.amt); debt.sort((a,b)=>b.amt-a.amt);
  const out = [];
  let i=0, j=0;
  while(i<debt.length && j<cred.length){
    const m = Math.min(debt[i].amt, cred[j].amt);
    if(m > 0) out.push({from:debt[i].who, to:cred[j].who, amt:m});
    debt[i].amt -= m; cred[j].amt -= m;
    if(debt[i].amt <= 0) i++;
    if(cred[j].amt <= 0) j++;
  }
  return out;
}

function sliceHours(times, vals, iso, from, to){
  const out = [];
  for(let i=0;i<times.length;i++){

    if(h >= from && h < to) out.push(vals[i]);

const maxOf = a => a.length ? Math.max.apply(null,a) : null;
const minOf = a => a.length ? Math.min.apply(null,a) : null;

function buildCond(iso, land){
  const lt = land.hourly.time;
  const mMM = sum(sliceHours(lt, land.hourly.precipitation, iso, 6, 12));
  const aMM = sum(sliceHours(lt, land.hourly.precipitation, iso, 12, 18));
  const mP  = maxOf(sliceHours(lt, land.hourly.precipitation_probability, iso, 6, 12)) || 0;
  const aP  = maxOf(sliceHours(lt, land.hourly.precipitation_probability, iso, 12, 18)) || 0;
  const di  = land.daily.time.indexOf(iso);
  const dayMM = di >= 0 ? (land.daily.precipitation_sum[di] || 0) : (mMM + aMM);

  let rain = '오전 ' + rainLabel(mMM, mP) + ' · 오후 ' + rainLabel(aMM, aP);
  if(dayMM >= 1) rain += ' · ' + round1(dayMM) + 'mm';

  const out = { rain: rain, rainLevel: dayMM >= 10 ? 'heavy' : '' };
  if(di >= 0 && land.daily.temperature_2m_min){
    out.temp = Math.round(land.daily.temperature_2m_min[di]) + '~' + Math.round(land.daily.temperature_2m_max[di]) + '℃';
  }
  const ev = sliceHours(lt, land.hourly.temperature_2m, iso, 17, 21);
  if(ev.length) out.evening = '저녁 ' + Math.round(minOf(ev)) + '~' + Math.round(maxOf(ev)) + '℃';
  return out;
}
function applyForecast(land){
  DAYS.forEach(d=>{
    const iso = FC_DATES[d.date];
    if(!iso || land.daily.time.indexOf(iso) < 0) return;
    try{ Object.assign(d.cond, buildCond(iso, land)); }catch(e){}
  });
}
function loadForecast(){
  const url = 'https://api.open-meteo.com/v1/forecast?latitude='+FC_LAT+'&longitude='+FC_LNG
    +'&hourly=precipitation_probability,precipitation,temperature_2m'
    +'&daily=precipitation_sum,temperature_2m_max,temperature_2m_min'
    +'&timezone=Asia%2FSeoul&forecast_days=16';
  try{
    const c = JSON.parse(localStorage.getItem(FC_KEY)||'null');
    if(c && c.land){ applyForecast(c.land); fcStamp = c.ts; repaintCurrent(); }
  }catch(e){}
  fetch(url).then(r=>r.json()).then(land=>{
    if(!land || !land.hourly) throw new Error('bad forecast');
    const has = land.daily.time.indexOf(FC_DATES['9/13']) >= 0;
    fcOutOfRange = !has;
    if(has){
      fcStamp = new Date().toISOString();
      try{ localStorage.setItem(FC_KEY, JSON.stringify({ts:fcStamp, land:land})); }catch(e){}
      applyForecast(land);
    }
    repaintCurrent();
  }).catch(()=>{});
}
function daysLeft(){
  const t = new Date(); t.setHours(0,0,0,0);
  return Math.round((new Date('2026-09-13T00:00:00+09:00') - t) / 86400000);
}

    m[it.place].times.push({time:it.time,title:it.title,emoji:it.emoji});
  });
  return order.map((id,i)=>Object.assign({seq:i+1,id,times:m[id].times}, PLACES[id]));
}

function haversine(aLat,aLng,bLat,bLng){
  const R=6371,r=Math.PI/180;
  const dLat=(bLat-aLat)*r, dLng=(bLng-aLng)*r;
  const s=Math.sin(dLat/2)**2+Math.cos(aLat*r)*Math.cos(bLat*r)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
function naverDir(f,t,mode){
  return 'https://map.naver.com/p/directions/'
    +f.lng+','+f.lat+','+encodeURIComponent(f.name)+',,/'
    +t.lng+','+t.lat+','+encodeURIComponent(t.name)+',,/-/'+mode;
}
function routeChip(f,t){
  const km=haversine(f.lat,f.lng,t.lat,t.lng);
  if(km<0.25) return '';
  const drive = km > 1.2;
  const mode = drive ? 'car' : 'walk';
  const icon = drive ? '🚗' : '🚶';
  const label = drive ? '차' : '도보';
  const timeTxt = drive ? '' : (' · 약 '+Math.max(1,Math.round(km*1.3/4.2*60))+'분');
  return '<a class="route" href="'+naverDir(f,t,mode)+'" target="_blank" rel="noopener">'
        +'🧭 '+f.name+' <span class="arr">→</span> '+t.name+' · '+icon+' '+label+timeTxt+' 길찾기</a>';
}

  const panel = document.getElementById('panel');
  panel.innerHTML = '<div class="timeline" id="timeline"></div>';
  const tl = document.getElementById('timeline');
  const seqOf={}; places.forEach(p=>seqOf[p.id]=p.seq);
  let prevPlace=null;
  day.items.forEach(it=>{
    const p = it.place ? PLACES[it.place] : null;
    const type = p ? p.type : 'plain';
    let routeHtml='';
    if(p && prevPlace && it.place!==prevPlace) routeHtml = routeChip(PLACES[prevPlace], p);
    if(p) prevPlace = it.place;
    const row = document.createElement('div');
    row.className = 'ti' + (p ? ' clickable' : '') + (it.hl ? ' hl' : '');
    row.innerHTML =
      '<div class="time">'+it.time+'</div>'
      +'<div class="node"><div class="badge '+type+'">'+it.emoji+'</div>'
      +'<div class="body"><div class="title">'+it.title+'</div>'
      +(p ? '<div class="place"><span class="seq">'+seqOf[it.place]+'</span><span class="pin">📍</span>'+p.name+'</div>' : '')
      +(it.note ? '<div class="note">'+it.note+'</div>' : '')
      +(it.dnote ? '<div class="dnote">🗓️ <span>'+it.dnote+'</span></div>' : '')
      +(it.rnote ? '<div class="rnote">⚠️ <span>'+it.rnote+'</span></div>' : '')
      + routeHtml
      +'</div></div>';
    if(p) row.addEventListener('click', (e)=>{
      if(e.target.closest('.route')) return;
      document.querySelectorAll('.ti').forEach(x=>x.classList.remove('active'));
      row.classList.add('active');
      const mk = markerById[it.place];
      if(mk){ map.panTo(mk.getLatLng(),{animate:true}); mk.openPopup(); }
    });
    tl.appendChild(row);
  });
}

    return Object.assign({}, e, {memo:m.memo, payer:m.payer, who:m.who});
  });
  const total = list.reduce((s,e)=>s+e.amount,0);
  const byCat = {};
  const paid = {}, bear = {};
  MEMBERS.forEach(m=>{ paid[m]=0; bear[m]=0; });
  list.forEach(e=>{
    byCat[e.cat] = (byCat[e.cat]||0)+e.amount;
    if(e.payer === '공동') MEMBERS.forEach(m=>paid[m] += e.amount/MEMBERS.length);
    else if(paid[e.payer] !== undefined) paid[e.payer] += e.amount;
    const who = (e.who && e.who.length) ? e.who : MEMBERS;
    who.forEach(m=>{ if(bear[m]!==undefined) bear[m] += e.amount/who.length; });
  });
  const net = {};
  MEMBERS.forEach(m=>net[m] = paid[m]-bear[m]);
  const transfers = settle(net);

  document.getElementById('planHead').innerHTML =
    '<div class="ph-title">💰 여행 지출</div>'
    +'<div class="ph-sub">'+MEMBERS.join(' · ')+' 4명 기준. 누가 냈는지와 <b>누가 나눠 낼지</b>를 따로 잡을 수 있어요 '
    +'(예: 셋만 먹은 점심). 항목을 누르면 수정됩니다.</div>';
  document.getElementById('foot').innerHTML = (SYNC_URL
    ? '💡 모든 지출은 <b>구글시트에 저장</b>됩니다 — 넷이 각자 폰에서 넣어도 같은 목록이고, <b>구글시트 앱에서 직접 고쳐도</b> 돼요(다음에 열 때 반영). '
      +'신호가 약하면 일단 폰에 쌓아뒀다가 <b>연결되면 자동으로</b> 올라갑니다. '
      +'낸 사람·분담은 시트 메모 칸에 <b>지출자:소진 · 분담:은정,주희</b> 형태로 같이 들어가요.'
    : '💡 여기 기록은 <b>이 브라우저에만 저장</b>돼요(localStorage). 다 같이 보려면 <b>📋 복사</b>로 카톡에 붙여넣으세요.')
    +' 미리 넣어둔 3건(숙박 55만 + 자쿠지 5만 + 바베큐 5만 = <b>65만원, 1인 162,500원</b>)은 지출자가 <b>공동</b>으로 잡혀 있으니 '
    +'실제로 결제한 사람으로 바꿔주세요.'+liveLinks;

  let html = '<div class="exp-sec">';
  html += '<div class="exp-sum">'
    +'<div class="exp-card total"><div class="el">합계</div><div class="ev">'+won(total)+'</div></div>'
    +'<div class="exp-card total"><div class="el">엔빵 (1인당 평균)</div><div class="ev">'+won(total/MEMBERS.length)+'</div></div>'
    +'</div>';

  html += '<div class="exp-settle">'
    + (transfers.length
        ? '<div class="st">💸 이렇게 보내면 끝</div>'
          + transfers.map(t=>'<div class="pay-line">'+t.from+' → '+t.to+' <b>'+won(t.amt)+'</b></div>').join('')
        : '<div class="st">✅ 정산 끝 — 딱 맞아요</div>')
    + '<div class="sub" style="margin-top:7px">낸 돈 — '+MEMBERS.map(m=>m+' '+won(paid[m])).join(' · ')+'</div>'
    + '<div class="sub">부담할 몫 — '+MEMBERS.map(m=>m+' '+won(bear[m])).join(' · ')+'</div>'
    + '<div class="sub">※ 지출자가 <b>공동</b>인 항목은 4명이 똑같이 낸 것으로 봅니다.</div>'
    + '</div>';

  html += '<div class="exp-cats">';
  EXP_CATS.forEach(c=>{ if(byCat[c]) html += '<span class="exp-cat cat-'+c+'">'+c+' '+won(byCat[c])+'</span>'; });
  html += '</div>';

  html += '<table class="exp-table"><thead><tr>'
    +'<th>날짜</th><th>항목</th><th style="text-align:right">금액</th><th style="text-align:right">1인</th><th></th>'
    +'</tr></thead><tbody>';
  if(!list.length) html += '<tr><td colspan="5" style="color:var(--muted);padding:14px 6px">'
    +(SYNC_URL ? '아직 목록을 못 받아왔어요. 신호를 확인하고 🔄 새로고침을 눌러주세요.' : '아직 기록된 지출이 없어요.')
    +'</td></tr>';
  list.forEach(e=>{
    const who = (e.who && e.who.length) ? e.who : MEMBERS;
    html += '<tr>'
      +'<td class="edate">'+esc(e.date)+'</td>'
      +'<td><span class="exp-cat cat-'+esc(e.cat)+'" style="margin-right:5px">'+esc(e.cat)+'</span>'
      +'<span class="payer payer-'+esc(e.payer)+'" style="margin-right:5px">'+esc(e.payer)+'</span>'
      +'<span class="ename">'+esc(e.name)+'</span>'
      +(e.memo ? '<div class="ememo">'+esc(e.memo)+'</div>' : '')
      +(who.length < MEMBERS.length ? '<div class="ememo" style="color:#B03A6B">↳ '+who.join('·')+' '+who.length+'명이 나눔</div>' : '')
      +'</td>'
      +'<td class="amt">'+won(e.amount)+'</td>'
      +'<td class="per">'+won(e.amount/who.length)+'</td>'
      +'<td style="white-space:nowrap">'
      +'<button class="exp-edit" data-edit="'+esc(e.id)+'" title="수정">✏️</button>'
      +'<button class="exp-del" data-del="'+esc(e.id)+'" title="삭제">✕</button></td>'
      +'</tr>';
  });
  html += '</tbody></table>';

  const ed = expEditId ? list.filter(x=>x.id===expEditId)[0] : null;
  let lastPayer = '소진';
  try{ lastPayer = localStorage.getItem('yeongheung_last_payer') || '소진'; }catch(e){}
  const cur = ed || {date:'9/13', cat:'장보기', name:'', amount:'', memo:'', payer:lastPayer, who:MEMBERS.slice()};
  if(ed) formWho = cur.who.slice();
  const dateOpts = ['9/13','9/14'];
  if(dateOpts.indexOf(cur.date)<0) dateOpts.push(cur.date);

  html += '<div class="exp-form'+(ed?' editing':'')+'">'
    +'<h4>'+(ed ? '✏️ 항목 수정' : '➕ 지출 추가')+'</h4>'
    +'<div class="row">'
    +'<select id="fDate">'+dateOpts.map(d=>'<option'+(d===cur.date?' selected':'')+'>'+d+'</option>').join('')+'</select>'
    +'<select id="fCat">'+EXP_CATS.map(c=>'<option'+(c===cur.cat?' selected':'')+'>'+c+'</option>').join('')+'</select>'
    +'<input class="f-name" id="fName" placeholder="항목 (예: 이마트 장보기)" value="'+esc(cur.name)+'">'
    +'</div>'
    +'<div class="row">'
    +'<span style="font-size:11.5px;color:var(--muted)">낸 사람</span>'
    +'<select id="fPayer">'+PAYERS.map(x=>'<option'+(x===cur.payer?' selected':'')+'>'+x+'</option>').join('')+'</select>'
    +'<input class="f-amt" id="fAmt" inputmode="numeric" placeholder="금액" value="'+esc(cur.amount||'')+'">'
    +'<button class="exp-add" id="fAdd">'+(ed ? '저장' : '추가')+'</button>'
    +(ed ? '<button class="exp-cancel" id="fCancel">취소</button>' : '')
    +'</div>'
    +'<div class="row"><span style="font-size:11.5px;color:var(--muted)">나눠 낼 사람</span>'
    + MEMBERS.map(m=>'<span class="who'+(formWho.indexOf(m)>=0?' on':'')+'" data-who="'+m+'">'+m+'</span>').join('')
    +'</div>'
    +'<div class="row"><input class="f-memo" id="fMemo" placeholder="메모 (선택)" value="'+esc(cur.memo||'')+'"></div>'
    +'</div>';

  html += '<div class="exp-tools">'
    +'<span class="exp-tool" id="expCopy">📋 복사 (카톡용)</span>'
    +(SYNC_URL ? '<span class="exp-tool" id="expSync">🔄 새로고침</span>' : '')
    +'<span class="exp-tool" id="expReset">'+(SYNC_URL ? '↺ 이 기기 캐시 비우기' : '↺ 내가 추가한 것 모두 지우기')+'</span>'
    +'<span id="syncBadge" style="align-self:center;font-size:11.5px;font-weight:500"></span>'
    +'</div></div>';

  const panel = document.getElementById('panel');
  panel.innerHTML = html;

  function removeItem(id, st){
    st.added = st.added.filter(x=>x.id!==id);
    if(st.hidden.indexOf(id)<0) st.hidden.push(id);
    // 아직 시트에 못 올린 항목이면 대기열에서 빼기만 하면 된다
    const wasPending = st.pending.some(op=>op.action==='add' && op.item.id===id);
    st.pending = st.pending.filter(op=>!(op.action==='add' && op.item.id===id));
    if(SYNC_URL && !wasPending) st.pending.push({action:'delete', id:id});
  }
  panel.querySelectorAll('[data-del]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const id = b.getAttribute('data-del');
      if(!confirm('이 항목을 지울까요?')) return;
      const st = expStore(); removeItem(id, st); expSave(st);
      if(expEditId === id) expEditId = null;
      renderExpense();
      if(SYNC_URL) syncFlush();
    });
  });
  panel.querySelectorAll('[data-edit]').forEach(b=>{
    b.addEventListener('click', ()=>{
      expEditId = b.getAttribute('data-edit');
      renderExpense();
      const f = document.getElementById('fName');
      if(f) f.scrollIntoView({behavior:'smooth', block:'center'});
    });
  });
  panel.querySelectorAll('[data-who]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const m = el.getAttribute('data-who');
      const i = formWho.indexOf(m);
      if(i<0) formWho.push(m); else if(formWho.length>1) formWho.splice(i,1);
      el.classList.toggle('on', formWho.indexOf(m)>=0);
    });
  });
  const cancelBtn = document.getElementById('fCancel');
  if(cancelBtn) cancelBtn.addEventListener('click', ()=>{ expEditId=null; formWho=MEMBERS.slice(); renderExpense(); });

  document.getElementById('fAdd').addEventListener('click', ()=>{
    const name = document.getElementById('fName').value.trim();
    const raw  = document.getElementById('fAmt').value.replace(/[^0-9]/g,'');
    if(!name || !raw){ alert('항목과 금액을 입력해주세요.'); return; }
    const payer = document.getElementById('fPayer').value;
    try{ localStorage.setItem('yeongheung_last_payer', payer); }catch(e){}
    const st = expStore();
    // 수정은 "기존 삭제 + 새로 추가"로 처리한다 (시트 백엔드에 update가 없어서)
    if(expEditId) removeItem(expEditId, st);
    const item = {
      id: 'u'+Date.now(),
      date: document.getElementById('fDate').value,
      cat:  document.getElementById('fCat').value,
      name: name,
      amount: +raw,
      memo: joinMeta(document.getElementById('fMemo').value.trim(), payer, formWho.slice())
    };
    st.added.push(item);
    if(SYNC_URL) st.pending.push({action:'add', item:item});
    expSave(st);
    expEditId = null; formWho = MEMBERS.slice();
    renderExpense();
    if(SYNC_URL) syncFlush();
  });

  document.getElementById('expCopy').addEventListener('click', ()=>{
    let txt = '💰 영흥도 여행 지출 (9/13~14)\n\n';
    list.forEach(e=>{
      const who = (e.who && e.who.length) ? e.who : MEMBERS;
      txt += '· '+e.date+' ['+e.cat+'] '+e.name+' — '+won(e.amount)+' (낸 사람: '+e.payer
           + (who.length<MEMBERS.length ? ' / '+who.join('·')+' 분담' : '') + ')\n';
    });
    txt += '\n합계 '+won(total)+' · 1인 평균 '+won(total/MEMBERS.length)+'\n\n';
    txt += '낸 돈 — '+MEMBERS.map(m=>m+' '+won(paid[m])).join(' / ')+'\n';
    txt += '부담 몫 — '+MEMBERS.map(m=>m+' '+won(bear[m])).join(' / ')+'\n\n';
    txt += transfers.length ? transfers.map(t=>'💸 '+t.from+' → '+t.to+' '+won(t.amt)).join('\n') : '✅ 정산 끝';
    navigator.clipboard.writeText(txt).then(
      ()=>{ document.getElementById('expCopy').textContent = '✅ 복사됨'; },
      ()=>{ alert(txt); });
  });
  document.getElementById('expReset').addEventListener('click', ()=>{
    if(confirm(SYNC_URL
        ? '이 기기에 캐시된 목록만 비웁니다. 구글시트의 기록은 그대로이고 바로 다시 내려받아요. 진행할까요?'
        : '이 브라우저에 추가·삭제한 내용을 모두 되돌립니다. 진행할까요?')){
      expSave({added:[], hidden:[], pending:[]});
      renderExpense();
      if(SYNC_URL) syncFlush();
    }
  });

  const syncBtn = document.getElementById('expSync');
  if(syncBtn) syncBtn.addEventListener('click', ()=>syncFlush());
  paintSyncBadge();
}

/* ───────── 탭 ───────── */
const tabsEl = document.getElementById('tabs');
DAYS.forEach((d,i)=>{
  const el=document.createElement('div'); el.className='tab';
  el.innerHTML='<div class="dnum">DAY '+(i+1)+'</div><div class="ddate">'+d.date+'</div><div class="dsub">'+d.dow+'요일</div>';
  el.addEventListener('click', ()=>renderDay(i));
  tabsEl.appendChild(el);
});
[['prep','BUY','🛒','준비물',renderPrep],
 ['food','EAT','🍽️','주변',renderFood],
 ['money','₩','💰','지출',()=>{ renderExpense(); if(SYNC_URL) syncFlush(); }]].forEach(t=>{
  const el=document.createElement('div'); el.className='tab '+t[0];
  el.innerHTML='<div class="dnum">'+t[1]+'</div><div class="ddate">'+t[2]+'</div><div class="dsub">'+t[3]+'</div>';
  el.addEventListener('click', t[4]);
  tabsEl.appendChild(el);
});

document.getElementById('fitAll').addEventListener('click', ()=>{
  const all = allLatlngs.concat([[PLACES.gojan.lat,PLACES.gojan.lng],[PLACES.damso.lat,PLACES.damso.lng]]);
  map.fitBounds(L.latLngBounds(all).pad(0.2));
});

renderDay(0);
loadForecast();
// 신호가 돌아오면 밀린 것 자동 전송
window.addEventListener('online', ()=>{ if(SYNC_URL && expStore().pending.length) syncFlush(); });
// 페이지 열자마자 한 번 받아둔다 (지출 탭 눌렀을 때 바로 보이게)
if(SYNC_URL) syncFlush();
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) loadForecast(); });
window.addEventListener('resize', ()=>map.invalidateSize());
</script>
</body>
</html>
